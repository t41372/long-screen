# cargo-about config for scripts/notices.ts (`cargo about generate --format json -c scripts/notices-about.toml
# --manifest-path rust/Cargo.toml --workspace`). Kept outside rust/ deliberately: rust/** belongs to a different
# workstream's file ownership this round.
#
# Only permissive/attribution-only SPDX ids are pre-accepted; anything else — including copyleft licenses that
# would need legal review before shipping compiled into a Wasm binary — makes cargo-about fail the license
# synthesis and, in turn, fails `deno task build`/`build:prod`, rather than silently shipping an unreviewed
# license. MPL-2.0 is accepted because scripts/notices.ts adds the required "exact source available at" line for
# it itself (file-level copyleft; no case-by-case review needed to bundle it as a compiled dependency).
accepted = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
]
