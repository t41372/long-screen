# What this crate computes must come out bit for bit the same in the web page's WebAssembly and in every native host
# (the CLI, the Python module, any crate built on it). Natively, std's transcendental float methods call the
# platform's C math library, which can differ in the last bit from the musl code the WebAssembly build links, and the
# difference reaches placements and pixels. The `libm` crate is that musl code, so call it instead. sqrt, abs,
# floor, ceil, round, trunc, mul_add, min, max and % are exact under IEEE 754 everywhere and stay allowed.
disallowed-methods = [
  { path = "f64::exp", reason = "may round differently from the WebAssembly build natively; use libm::exp" },
  { path = "f64::exp2", reason = "may round differently from the WebAssembly build natively; use libm::exp2" },
  { path = "f64::exp_m1", reason = "may round differently from the WebAssembly build natively; use libm::expm1" },
  { path = "f64::ln", reason = "may round differently from the WebAssembly build natively; use libm::log" },
  { path = "f64::ln_1p", reason = "may round differently from the WebAssembly build natively; use libm::log1p" },
  { path = "f64::log", reason = "may round differently from the WebAssembly build natively; use libm::log" },
  { path = "f64::log2", reason = "may round differently from the WebAssembly build natively; use libm::log2" },
  { path = "f64::log10", reason = "may round differently from the WebAssembly build natively; use libm::log10" },
  { path = "f64::powf", reason = "may round differently from the WebAssembly build natively; use libm::powf" },
  { path = "f64::powi", reason = "its rounding is not specified across platforms; multiply it out" },
  { path = "f64::hypot", reason = "may round differently from the WebAssembly build natively; use libm::hypot" },
  { path = "f64::sin", reason = "may round differently from the WebAssembly build natively; use libm::sin" },
  { path = "f64::cos", reason = "may round differently from the WebAssembly build natively; use libm::cos" },
  { path = "f64::tan", reason = "may round differently from the WebAssembly build natively; use libm::tan" },
  { path = "f64::sin_cos", reason = "may round differently from the WebAssembly build natively; use libm::sincos" },
  { path = "f64::asin", reason = "may round differently from the WebAssembly build natively; use libm::asin" },
  { path = "f64::acos", reason = "may round differently from the WebAssembly build natively; use libm::acos" },
  { path = "f64::atan", reason = "may round differently from the WebAssembly build natively; use libm::atan" },
  { path = "f64::atan2", reason = "may round differently from the WebAssembly build natively; use libm::atan2" },
  { path = "f64::sinh", reason = "may round differently from the WebAssembly build natively; use libm::sinh" },
  { path = "f64::cosh", reason = "may round differently from the WebAssembly build natively; use libm::cosh" },
  { path = "f64::tanh", reason = "may round differently from the WebAssembly build natively; use libm::tanh" },
  { path = "f64::asinh", reason = "may round differently from the WebAssembly build natively; use libm::asinh" },
  { path = "f64::acosh", reason = "may round differently from the WebAssembly build natively; use libm::acosh" },
  { path = "f64::atanh", reason = "may round differently from the WebAssembly build natively; use libm::atanh" },
  { path = "f64::cbrt", reason = "may round differently from the WebAssembly build natively; use libm::cbrt" },
  { path = "f32::exp", reason = "may round differently from the WebAssembly build natively; use libm::expf" },
  { path = "f32::exp2", reason = "may round differently from the WebAssembly build natively; use libm::exp2f" },
  { path = "f32::exp_m1", reason = "may round differently from the WebAssembly build natively; use libm::expm1f" },
  { path = "f32::ln", reason = "may round differently from the WebAssembly build natively; use libm::logf" },
  { path = "f32::ln_1p", reason = "may round differently from the WebAssembly build natively; use libm::log1pf" },
  { path = "f32::log", reason = "may round differently from the WebAssembly build natively; use libm::logf" },
  { path = "f32::log2", reason = "may round differently from the WebAssembly build natively; use libm::log2f" },
  { path = "f32::log10", reason = "may round differently from the WebAssembly build natively; use libm::log10f" },
  { path = "f32::powf", reason = "may round differently from the WebAssembly build natively; use libm::powff" },
  { path = "f32::powi", reason = "its rounding is not specified across platforms; multiply it out" },
  { path = "f32::hypot", reason = "may round differently from the WebAssembly build natively; use libm::hypotf" },
  { path = "f32::sin", reason = "may round differently from the WebAssembly build natively; use libm::sinf" },
  { path = "f32::cos", reason = "may round differently from the WebAssembly build natively; use libm::cosf" },
  { path = "f32::tan", reason = "may round differently from the WebAssembly build natively; use libm::tanf" },
  { path = "f32::sin_cos", reason = "may round differently from the WebAssembly build natively; use libm::sincosf" },
  { path = "f32::asin", reason = "may round differently from the WebAssembly build natively; use libm::asinf" },
  { path = "f32::acos", reason = "may round differently from the WebAssembly build natively; use libm::acosf" },
  { path = "f32::atan", reason = "may round differently from the WebAssembly build natively; use libm::atanf" },
  { path = "f32::atan2", reason = "may round differently from the WebAssembly build natively; use libm::atan2f" },
  { path = "f32::sinh", reason = "may round differently from the WebAssembly build natively; use libm::sinhf" },
  { path = "f32::cosh", reason = "may round differently from the WebAssembly build natively; use libm::coshf" },
  { path = "f32::tanh", reason = "may round differently from the WebAssembly build natively; use libm::tanhf" },
  { path = "f32::asinh", reason = "may round differently from the WebAssembly build natively; use libm::asinhf" },
  { path = "f32::acosh", reason = "may round differently from the WebAssembly build natively; use libm::acoshf" },
  { path = "f32::atanh", reason = "may round differently from the WebAssembly build natively; use libm::atanhf" },
  { path = "f32::cbrt", reason = "may round differently from the WebAssembly build natively; use libm::cbrtf" },
]
