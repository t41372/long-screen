[workspace]
resolver = "2"
members = ["core", "engine", "wasm", "decode", "bench", "long-screen", "python"]
# Plain `cargo` commands (`cargo test --lib`, the wasm clippy runs in `deno task lint`) cover the crates that build for
# wasm32: the core, the engine and the wasm exports. scripts/build-core.sh names the wasm crate with `-p`; native-only
# crates (decode, bench, long-screen) are built by name with `-p` too.
default-members = ["core", "engine", "wasm"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

# Native benchmarks (rust/bench): the release settings, but unwinding as bench targets must (release aborts).
[profile.bench-native]
inherits = "release"
panic = "unwind"
debug = "line-tables-only"
