[workspace]
resolver = "2"
members = ["long-screen", "wasm", "bench", "python"]
# Plain `cargo` commands mean the published crate and the wasm exports: `cargo test --lib <name>` runs the kernels',
# the engine's and the driver's unit tests natively. They select long-screen with its native default features, so a
# command aimed at wasm32 adds `--no-default-features`, which is how rust/wasm depends on it (scripts/build-core.sh
# names the wasm crate with `-p`; `deno task lint` runs the wasm32 clippy that way). The native-only crates (bench,
# python) are built by name with `-p`.
default-members = ["long-screen", "wasm"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

# Native benchmarks (rust/bench): the release settings, but unwinding as bench targets must (release aborts).
[profile.bench-native]
inherits = "release"
panic = "unwind"
debug = "line-tables-only"
