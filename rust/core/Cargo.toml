[package]
name = "long-screen-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/t41372/long-screen"
homepage = "https://long-screen.yi-ting.com"
description = "Long Screen's reconstruction algorithms (motion, layers, tracking, compositing, presentation); the implementation layer under the long-screen crate"
readme = "README.md"
keywords = ["screenshot", "stitching", "panorama", "motion-estimation", "screen-recording"]
categories = ["computer-vision", "multimedia::images", "wasm"]
# Published (crates-v<version> tags, .github/workflows/release-crates.yml): only what the build and the crate page need.
include = ["Cargo.toml", "README.md", "LICENSE", "src/**/*.rs"]

[features]
# Native hosts (rust/long-screen) run `pool::par_for` chunks on rayon's thread pool. Never enabled for wasm: the
# threaded wasm build has its own Web Worker helpers.
rayon = ["dep:rayon"]

[dependencies]
rayon = { version = "1.12.0", optional = true }
# Every exp/pow/log/hypot the core computes (clippy.toml forbids std's forms). The WebAssembly build's
# compiler-builtins resolves std's math to this same musl-derived code, so calling it directly gives the page's
# results bit for bit on every native host too, instead of whatever the system's math library rounds to. Pinned to
# the copy the pinned toolchain (rust-toolchain.toml) vendors, whose source is identical to 0.2.16: a toolchain bump
# must recheck it, and the scenario fingerprints on the three wasm builds show any drift.
libm = "=0.2.16"
