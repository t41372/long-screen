[package]
name = "long-screen-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Long Screen reconstruction core compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Tile PNG codec (replaces the hand-rolled Sub filter + browser CompressionStream + JS CRC32 table — see
# rust/core/src/abi/png.rs). Pinned exact: a `png` point release can change its Adaptive-filter heuristic or its
# error Display text, either of which this crate depends on byte-for-byte (fingerprints) or string-for-string
# (`classify` in abi/png.rs). Brings in fdeflate/flate2/miniz_oxide/crc32fast transitively.
png = "=0.18.1"
# Already a transitive dependency of png (chunk CRCs); used directly for `ls_crc32` (crate::abi::png), which
# src/codec/crc.ts calls instead of carrying its own hand-rolled JS CRC32 table (src/export/zip.ts does not use
# this module — it streams through client-zip, which computes its own CRC32 in JS).
crc32fast = "=1.5.2"

# Versioned sparse source-candidate archives; no hand-written persistence codec.
serde = { version = "=1.0.228", features = ["derive"] }
serde_bytes = "=0.11.19"
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
serde_json = { version = "=1.0.149", features = ["float_roundtrip"] }
# Hot source/model pages are decoded repeatedly; use fast, lossless blocks, not PNG/deflate.
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
