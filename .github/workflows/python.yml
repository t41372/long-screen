# The Python package (rust/python, PyPI distribution `long-screen`): abi3 wheels for CPython 3.11+ on macOS (arm64,
# x86_64), Linux (manylinux x86_64, aarch64) and Windows (x86_64), plus the sdist. Each wheel is installed and the
# synthetic tests run against it on a machine of its own platform where the runner can execute it. Pushing a tag
# `py-v<version>` (the version in rust/python/Cargo.toml) also publishes to PyPI by trusted publishing; other runs only
# build. Deploys of the web app do not depend on this workflow.
#
# Decoding at runtime: macOS wheels decode with AVFoundation and Windows wheels with Media Foundation (both part of
# the system); Linux wheels, and files the system decoder cannot read, need a user-installed ffmpeg/ffprobe on PATH
# (not bundled). The PyPI README says so.
name: Python package

on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  MATURIN_VERSION: v1.15.0

jobs:
  linux:
    name: Linux ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { target: x86_64, runner: ubuntu-24.04 }
          - { target: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: "2_28"
          working-directory: rust/python
          args: --release --locked --out dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test the wheel
        run: |
          python -m pip install rust/python/dist/*.whl pytest pillow
          python -m pytest rust/python/tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: rust/python/dist

  macos:
    name: macOS ${{ matrix.target }}
    runs-on: macos-14
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          working-directory: rust/python
          args: --release --locked --out dist
      - uses: actions/setup-python@v5
        if: matrix.target == 'aarch64-apple-darwin'
        with:
          python-version: "3.11"
      - name: Test the wheel
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          python -m pip install rust/python/dist/*.whl pytest pillow
          python -m pytest rust/python/tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: rust/python/dist

  windows:
    name: Windows x86_64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: x64
          working-directory: rust/python
          args: --release --locked --out dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test the wheel
        shell: bash
        run: |
          python -m pip install rust/python/dist/*.whl pytest pillow
          python -m pytest rust/python/tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64
          path: rust/python/dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          working-directory: rust/python
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: rust/python/dist

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/py-v')
    needs: [linux, macos, windows, sdist]
    runs-on: ubuntu-24.04
    # The PyPI project's trusted publisher names this repository, this workflow file and this environment.
    environment:
      name: pypi
      url: https://pypi.org/project/long-screen/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag against the package version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' rust/python/Cargo.toml | head -n 1)
          if [ "py-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match rust/python/Cargo.toml version $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
