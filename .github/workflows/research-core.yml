name: Core research harness

on:
  push:
    branches:
      - research/map-robustness-20261014
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test native core
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply the current research transform
        run: |
          python3 research/apply-map-robustness.py
          python3 research/add-near-miss-fallback.py

      - name: Install the pinned Rust toolchain
        working-directory: rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust

      - name: Run native core tests
        working-directory: rust
        run: cargo test --locked -p long-screen

      - name: Build release CLI
        working-directory: rust
        run: cargo build --locked --release -p long-screen --bin long-screen

      - name: Stage CLI
        run: |
          mkdir -p research-bin
          cp rust/target/release/long-screen research-bin/long-screen
          chmod +x research-bin/long-screen
          research-bin/long-screen --version | tee research-bin/version.txt
          ldd research-bin/long-screen | tee research-bin/ldd.txt
          sha256sum research-bin/long-screen | tee research-bin/sha256.txt
          git diff --stat | tee research-bin/patch-stat.txt
          git diff > research-bin/applied.patch

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: long-screen-linux-${{ github.sha }}
          path: research-bin
          if-no-files-found: error
          retention-days: 14

  public-recordings:
    name: Public ${{ matrix.case.id }}
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[public]')
    needs: build-and-test
    runs-on: ubuntu-26.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case:
          - id: test-1-basic-anypath
            file: test_1_sdr_desktop_basic_anypath.mov
          - id: test-2-gpt-floating
            file: test_2_sdr_desktop_gpt_scroll_with_floating.mov
          - id: test-3-hdr-vertical
            file: test_3_hdr_desktop_vertical.mov
          - id: test-4-hdr-monalisa
            file: test_4_hdr_monalisa.mov
          - id: test-5-hdr-image
            file: test_5_hdr_image.mov
          - id: test-6-iphone-safari
            file: test_6_iphone_safari.MP4
          - id: test-7-iphone-chatgpt
            file: test_7_iphone_chatgpt.MP4
          - id: test-8-iphone-signal
            file: test_8_iphone_signal.MP4
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: long-screen-linux-${{ github.sha }}
          path: research-bin

      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg time
          chmod +x research-bin/long-screen

      - name: Fetch public recording
        env:
          FILE: ${{ matrix.case.file }}
        run: |
          mkdir -p input results/canvases
          curl --fail --location --silent --show-error --retry 3 \
            --output "input/$FILE" \
            "https://github.com/t41372/long-screen/releases/download/test-cases-v1/$FILE"
          sha256sum "input/$FILE" | tee results/input-sha256.txt
          ffprobe -v error -show_entries \
            format=duration,size:stream=codec_name,width,height,r_frame_rate,avg_frame_rate,nb_frames,color_transfer \
            -of json "input/$FILE" > results/input-probe.json

      - name: Run native pipeline
        id: run
        continue-on-error: true
        env:
          FILE: ${{ matrix.case.file }}
        run: |
          set +e
          /usr/bin/time -v -o results/time.txt \
            timeout --signal=TERM --kill-after=60s 60m \
            research-bin/long-screen "input/$FILE" \
              --out-dir results/canvases \
              --json results/report.json \
              --backend ffmpeg \
              --threads 2 \
              --memory-mb 128 \
              --store-mb 256 \
              > results/stdout.txt 2> results/stderr.txt
          code=$?
          echo "$code" | tee results/exit-code.txt
          exit 0

      - name: Inventory outputs
        if: always()
        run: |
          find results -type f -printf '%P\t%s bytes\n' | sort | tee results/files.txt
          find results/canvases -type f -name '*.png' -print0 | sort -z | xargs -0 -r sha256sum > results/canvas-sha256.txt
          python3 - <<'PY' > results/png-dimensions.tsv
          import pathlib, struct
          for path in sorted(pathlib.Path('results/canvases').glob('*.png')):
              with path.open('rb') as f:
                  if f.read(8) != b'\x89PNG\r\n\x1a\n':
                      continue
                  length = struct.unpack('>I', f.read(4))[0]
                  if f.read(4) != b'IHDR' or length < 8:
                      continue
                  width, height = struct.unpack('>II', f.read(8))
              print(f'{path.name}\t{width}\t{height}\t{path.stat().st_size}')
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: public-${{ matrix.case.id }}-${{ github.sha }}
          path: results
          if-no-files-found: error
          retention-days: 14
