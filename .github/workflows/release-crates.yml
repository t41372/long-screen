# The Rust crates on crates.io: long-screen-core, long-screen-engine, long-screen-decode and long-screen (the native
# driver library and the `long-screen` command line). Pushing a tag `crates-v<version>` checks that all four crates
# carry that version, packages and builds them against each other on Linux, macOS and Windows, then publishes them in
# dependency order by crates.io trusted publishing (no stored token). Pull requests and branches never run it, and
# deploys of the web app do not depend on it (production builds on Cloudflare Pages from main).
#
# Trusted publishing (https://crates.io/docs/trusted-publishing, RFC 3691): each crate's settings on crates.io name
# this repository, this workflow file and the `crates-io` environment. crates.io only accepts it for crates that
# already exist, so each crate's first version is published by hand with an API token.
name: Rust crates

on:
  push:
    tags: ["crates-v*"]

permissions:
  contents: read

jobs:
  check:
    name: Package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # The decoder has a backend per system (Media Foundation, AVFoundation, ffmpeg); each must build.
        os: [ubuntu-24.04, macos-14, windows-2022]
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Check the tag against the crate versions
        if: runner.os == 'Linux'
        run: |
          version="${GITHUB_REF_NAME#crates-v}"
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/metadata.json"
          status=0
          for name in long-screen-core long-screen-engine long-screen-decode long-screen; do
            actual=$(jq -r --arg n "$name" '.packages[] | select(.name == $n) | .version' "$RUNNER_TEMP/metadata.json")
            if [ "$actual" != "$version" ]; then
              echo "::error::$name is at $actual, the tag $GITHUB_REF_NAME says $version"
              status=1
            fi
          done
          # Every dependency of a published crate on another one must ask for exactly this version (=x.y.z): results
          # depend on the core, the engine and the driver coming from the same release.
          wrong=$(jq -r --arg v "=$version" '.packages[]
            | select(.name | IN("long-screen-core", "long-screen-engine", "long-screen-decode", "long-screen"))
            | .name as $p | .dependencies[]
            | select(.name | IN("long-screen-core", "long-screen-engine", "long-screen-decode"))
            | select(.req != $v) | "\($p) -> \(.name) \(.req)"' "$RUNNER_TEMP/metadata.json")
          if [ -n "$wrong" ]; then
            echo "::error::dependencies not on version $version: $wrong"
            status=1
          fi
          exit $status

      # Packages each crate, then builds it from the package against the other packaged crates (cargo's local
      # registry overlay), exactly as crates.io users will get it.
      - name: Package and verify
        run: cargo publish --dry-run --locked -p long-screen-core -p long-screen-engine -p long-screen-decode -p long-screen

      - name: Unit tests and doctests (crate docs and READMEs)
        run: |
          cargo test --locked --lib -p long-screen-core -p long-screen-engine -p long-screen-decode -p long-screen
          cargo test --locked --doc -p long-screen-core -p long-screen-engine -p long-screen-decode -p long-screen

  publish:
    name: Publish to crates.io
    needs: check
    runs-on: ubuntu-24.04
    environment:
      name: crates-io
      url: https://crates.io/crates/long-screen
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      # A short-lived publish token for the crates whose trusted publisher names this workflow; the action's post step
      # revokes it when the job ends.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # One invocation: cargo publishes in dependency order and waits for each crate to reach the index before the
      # next. If a run stops partway, delete nothing: rerunning fails on the crates already published, so publish the
      # rest by hand (`cargo publish -p <crate>`) at the same commit.
      - name: Publish
        run: cargo publish --locked -p long-screen-core -p long-screen-engine -p long-screen-decode -p long-screen
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
