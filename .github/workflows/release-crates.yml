# The Rust crate on crates.io: long-screen (the driver library and the `long-screen` command line, with the kernels,
# the engine and the native decoders as its modules). Pushing a tag `crates-v<version>` checks that the crate carries
# that version, packages it and builds and tests it from the package on Linux, macOS and Windows, then publishes it by
# crates.io trusted publishing (no stored token). Running the workflow by hand (Actions → Rust crates → Run workflow)
# runs only the checks, as a preflight; it never publishes. Pull requests and branches never run it, and deploys of
# the web app do not depend on it (production builds on Cloudflare Pages from main).
#
# Trusted publishing (https://crates.io/docs/trusted-publishing, RFC 3691): the crate's settings on crates.io name
# this repository, this workflow file and the `crates-io` environment. crates.io only accepts it for a crate that
# already exists, so the first version is published by hand with an API token (docs/RELEASING.md §6.2). A tag whose
# version is already on crates.io (such as that first version's) passes the checks and skips the upload with a notice.
name: Rust crates

on:
  push:
    tags: ["crates-v*"]
  workflow_dispatch:

permissions:
  contents: read

# One run per tag or branch at a time; a release that has started is never cancelled halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # The decoder has a backend per system (Media Foundation, AVFoundation, ffmpeg); each must build.
        os: [ubuntu-26.04, macos-26, windows-2025]
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Check the tag against the crate version
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/crates-v')
        run: |
          version="${GITHUB_REF_NAME#crates-v}"
          actual=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "long-screen") | .version')
          if [ "$actual" != "$version" ]; then
            echo "::error::long-screen is at $actual, the tag $GITHUB_REF_NAME says $version"
            exit 1
          fi

      # Packages the crate, then builds it from the package with its default features, exactly as crates.io users
      # will get it.
      - name: Package and verify
        run: cargo publish --dry-run --locked -p long-screen

      # The web page builds the same package for wasm32 without the native defaults (only the kernels and the
      # engine); the packaged copy must build that way too. Outside the workspace, so the pinned toolchain is named.
      - name: Build the package for wasm32 without default features
        if: runner.os == 'Linux'
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "long-screen") | .version')
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          cargo package --locked --no-verify -p long-screen
          tar -xzf "target/package/long-screen-$version.crate" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/long-screen-$version"
          cargo "+$toolchain" build --locked --target wasm32-unknown-unknown --no-default-features

      - name: Unit tests and doctests (crate docs and README)
        run: |
          cargo test --locked --lib -p long-screen
          cargo test --locked --doc -p long-screen

  publish:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/crates-v')
    needs: check
    runs-on: ubuntu-26.04
    environment:
      name: crates-io
      url: https://crates.io/crates/long-screen
    permissions:
      contents: read # check out the repository
      id-token: write # crates.io trusted publishing: GitHub's OIDC identity token
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # crates.io never accepts a version twice. When this one is already there (the first version, published by
      # hand), the run ends green without uploading.
      - name: Check whether this version is already on crates.io
        id: existing
        run: |
          version="${GITHUB_REF_NAME#crates-v}"
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "long-screen release workflow (https://github.com/${GITHUB_REPOSITORY})" \
            "https://crates.io/api/v1/crates/long-screen/$version")
          if [ "$status" = 200 ]; then
            echo "::notice::long-screen $version is already on crates.io; nothing to publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = 404 ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::crates.io answered $status for long-screen $version"
            exit 1
          fi

      - name: Install the pinned Rust toolchain
        if: steps.existing.outputs.published == 'false'
        run: rustup toolchain install

      # A short-lived publish token for the crate whose trusted publisher names this workflow; the action's post step
      # revokes it when the job ends.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: steps.existing.outputs.published == 'false'
        id: auth

      - name: Publish
        if: steps.existing.outputs.published == 'false'
        run: cargo publish --locked -p long-screen
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
